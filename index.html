<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GKSterling Time Tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 16px;
    color: #222;
  }
  h1 {
    font-size: 1.4rem;
    text-align: center;
    margin-bottom: 16px;
  }
  .container {
    max-width: 1000px;
    margin: 0 auto;
  }
  .layout {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
  }
  .layout > div {
    flex: 1;
    min-width: 280px;
  }
  .tracker-col { order: 2; }
  .team-hours-col { order: 3; }
  .recent-col { order: 1; }

  @media (max-width: 900px) {
    .layout { flex-direction: column; }
    .tracker-col { order: 1; }
    .team-hours-col { order: 2; }
    .recent-col { order: 3; }
  }

  select {
    width: 100%;
    padding: 12px;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-bottom: 16px;
    background: white;
  }
  textarea {
    width: 100%;
    padding: 10px;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-top: 12px;
    font-family: inherit;
    resize: vertical;
    min-height: 60px;
  }
  .card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    text-align: center;
  }
  .saved-display {
    font-size: 1.8rem;
    font-weight: bold;
    color: #555;
    margin: 8px 0;
  }
  .hours-display {
    font-size: 3rem;
    font-weight: bold;
    margin: 12px 0;
  }
  .buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 16px 0;
  }
  button {
    font-size: 1.5rem;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    background: #4a7cf6;
    color: white;
    cursor: pointer;
  }
  button:active { background: #3a63c9; }
  .save-btn {
    width: 100%;
    height: auto;
    border-radius: 8px;
    padding: 14px;
    font-size: 1rem;
    margin-top: 10px;
    background: #2ecc71;
  }
  .save-btn:disabled {
    background: #aaa;
  }
  .status {
    text-align: center;
    margin-top: 10px;
    font-size: 0.9rem;
    color: #666;
    min-height: 20px;
  }
  .list-card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    height: 360px;
    overflow-y: auto;
  }
  .list-card h2 {
    font-size: 1.1rem;
    margin-top: 0;
  }
  .list-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
  }
  .list-row:last-child {
    border-bottom: none;
  }
  .total-card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    margin-top: 16px;
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    font-size: 1.1rem;
  }
  .log-entry {
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    font-size: 0.9rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .log-entry:last-child {
    border-bottom: none;
  }
  .log-content {
    flex: 1;
  }
  .log-name {
    font-weight: bold;
  }
  .log-change {
    color: #2ecc71;
    font-weight: bold;
  }
  .log-change.negative {
    color: #e74c3c;
  }
  .log-reason {
    color: #666;
    margin-top: 2px;
  }
  .log-time {
    color: #999;
    font-size: 0.75rem;
    margin-top: 2px;
  }
  .delete-btn {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: #e74c3c;
    color: white;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }

  /* Loading spinner */
  .loading-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 0;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #ddd;
    border-top: 4px solid #4a7cf6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .loading-text {
    margin-top: 12px;
    color: #666;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<div class="container">
  <h1>GKSterling Time Tracker</h1>

  <div class="loading-wrap" id="loadingWrap">
    <div class="spinner"></div>
    <div class="loading-text">Loading...</div>
  </div>

  <div class="layout" id="mainLayout" style="display:none;">

    <div class="recent-col">
      <div class="list-card">
        <h2>Recent Changes</h2>
        <div id="recentList"></div>
      </div>
    </div>

    <div class="tracker-col">
      <select id="nameSelect">
        <option value="">-- Select your name --</option>
      </select>

      <div class="card" id="card" style="display:none;">
        <div>Current Hours</div>
        <div class="saved-display" id="savedDisplay">0</div>

        <div style="margin-top:20px;">Added Hours</div>
        <div class="hours-display" id="hoursDisplay">0.0</div>
        <div class="buttons">
          <button onclick="changeHours(-0.5)">−</button>
          <button onclick="changeHours(0.5)">+</button>
        </div>
        <textarea id="reasonText" placeholder="What did you do?"></textarea>
        <button class="save-btn" id="saveBtn" onclick="saveHours()">Submit</button>
        <div class="status" id="status"></div>
      </div>
    </div>

    <div class="team-hours-col">
      <div class="list-card">
        <h2>Team Hours</h2>
        <div id="hoursList"></div>
      </div>
      <div class="total-card">
        <span>Total Hours</span>
        <span id="totalHours">0</span>
      </div>
    </div>

  </div>
</div>

<script>
// PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyk1tE3quJV_kU__gYxxI0BstXFSIbPrMVN_qzNH43OEZVwwrpbc8Zv3ERdeaNcoc1NSA/exec";

let people = [];
let addedHours = 0;
let currentRow = null;

async function loadData() {
  const status = document.getElementById('status');
  try {
    const res = await fetch(SCRIPT_URL);
    const data = await res.json();
    people = data.people;
    people.sort((a, b) => b.hours - a.hours);

    const select = document.getElementById('nameSelect');
    const previousValue = select.value;
    select.innerHTML = '<option value="">-- Select your name --</option>';
    people.forEach((p, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = p.name;
      select.appendChild(opt);
    });

    renderList(data.total);
    renderLog(data.log || []);

    document.getElementById('loadingWrap').style.display = 'none';
    document.getElementById('mainLayout').style.display = 'flex';

    return previousValue;
  } catch (err) {
    document.getElementById('loadingWrap').innerHTML =
      '<div class="loading-text">Could not load data. Check your connection and refresh.</div>';
  }
}

function renderList(total) {
  const listEl = document.getElementById('hoursList');
  listEl.innerHTML = '';
  people.forEach(p => {
    const row = document.createElement('div');
    row.className = 'list-row';
    row.innerHTML = `<span>${p.name}</span><span>${Number(p.hours).toFixed(1)}</span>`;
    listEl.appendChild(row);
  });
  document.getElementById('totalHours').textContent = Number(total).toFixed(1);
}

function renderLog(log) {
  const logEl = document.getElementById('recentList');
  logEl.innerHTML = '';
  if (log.length === 0) {
    logEl.innerHTML = '<div class="log-entry"><div class="log-content">No recent changes yet.</div></div>';
    return;
  }
  log.forEach(entry => {
    const div = document.createElement('div');
    div.className = 'log-entry';
    const changeNum = Number(entry.change);
    const changeClass = changeNum < 0 ? 'log-change negative' : 'log-change';
    const changeStr = (changeNum > 0 ? '+' : '') + changeNum.toFixed(1);
    const date = new Date(entry.timestamp);
    const timeStr = date.toLocaleString();
    div.innerHTML = `
      <div class="log-content">
        <div><span class="log-name">${entry.name}</span> <span class="${changeClass}">${changeStr}</span></div>
        <div class="log-reason">${entry.reason ? entry.reason : ''}</div>
        <div class="log-time">${timeStr}</div>
      </div>
      <button class="delete-btn" title="Delete this entry">−</button>
    `;
    div.querySelector('.delete-btn').addEventListener('click', () => deleteLogEntry(entry.logRow));
    logEl.appendChild(div);
  });
}

async function deleteLogEntry(logRow) {
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'delete', logRow: logRow })
    });
    await loadData();
  } catch (err) {
    alert("Could not delete entry. Try again.");
  }
}

document.getElementById('nameSelect').addEventListener('change', (e) => {
  const idx = e.target.value;
  const card = document.getElementById('card');
  if (idx === "") {
    card.style.display = 'none';
    return;
  }
  const person = people[idx];
  currentRow = person.row;
  addedHours = 0;
  document.getElementById('savedDisplay').textContent = Number(person.hours).toFixed(1);
  document.getElementById('hoursDisplay').textContent = addedHours.toFixed(1);
  document.getElementById('reasonText').value = '';
  document.getElementById('status').textContent = '';
  card.style.display = 'block';
});

function changeHours(delta) {
  addedHours = Math.round((addedHours + delta) * 10) / 10;
  const display = (addedHours > 0 ? '+' : '') + addedHours.toFixed(1);
  document.getElementById('hoursDisplay').textContent = display;
}

async function saveHours() {
  const btn = document.getElementById('saveBtn');
  const status = document.getElementById('status');
  const idx = document.getElementById('nameSelect').value;
  const person = people[idx];
  const newTotal = Number(person.hours) + addedHours;
  const reason = document.getElementById('reasonText').value.trim();

  btn.disabled = true;
  status.textContent = "Submitting...";
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        row: currentRow,
        hours: newTotal,
        name: person.name,
        changeText: addedHours.toFixed(1),
        reason: reason
      })
    });
    status.textContent = "Submitted!";
    await loadData();

    const newIdx = people.findIndex(p => p.row === currentRow);
    const select = document.getElementById('nameSelect');
    select.value = newIdx;
    addedHours = 0;
    document.getElementById('savedDisplay').textContent = newTotal.toFixed(1);
    document.getElementById('hoursDisplay').textContent = "0.0";
    document.getElementById('reasonText').value = '';
  } catch (err) {
    status.textContent = "Error submitting. Try again.";
  }
  btn.disabled = false;
  setTimeout(() => { status.textContent = ''; }, 2000);
}

loadData();
</script>
</body>
</html>
