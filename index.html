<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hours Tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 16px;
    color: #222;
  }
  h1 {
    font-size: 1.4rem;
    text-align: center;
    margin-bottom: 16px;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
  }
  select {
    width: 100%;
    padding: 12px;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-bottom: 16px;
    background: white;
  }
  .card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    text-align: center;
  }
  .hours-display {
    font-size: 3rem;
    font-weight: bold;
    margin: 12px 0;
  }
  .buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 16px 0;
  }
  button {
    font-size: 1.5rem;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    background: #4a7cf6;
    color: white;
    cursor: pointer;
  }
  button:active { background: #3a63c9; }
  .save-btn {
    width: 100%;
    height: auto;
    border-radius: 8px;
    padding: 14px;
    font-size: 1rem;
    margin-top: 10px;
    background: #2ecc71;
  }
  .save-btn:disabled {
    background: #aaa;
  }
  .status {
    text-align: center;
    margin-top: 10px;
    font-size: 0.9rem;
    color: #666;
    min-height: 20px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Team Hours Tracker</h1>

  <select id="nameSelect">
    <option value="">-- Select your name --</option>
  </select>

  <div class="card" id="card" style="display:none;">
    <div>Hours</div>
    <div class="hours-display" id="hoursDisplay">0</div>
    <div class="buttons">
      <button onclick="changeHours(-1)">−</button>
      <button onclick="changeHours(1)">+</button>
    </div>
    <button class="save-btn" id="saveBtn" onclick="saveHours()">Save</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
// PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyk1tE3quJV_kU__gYxxI0BstXFSIbPrMVN_qzNH43OEZVwwrpbc8Zv3ERdeaNcoc1NSA/exec";

let people = [];
let currentHours = 0;
let currentRow = null;

async function loadData() {
  const status = document.getElementById('status');
  try {
    const res = await fetch(SCRIPT_URL);
    people = await res.json();
    const select = document.getElementById('nameSelect');
    select.innerHTML = '<option value="">-- Select your name --</option>';
    people.forEach((p, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = p.name;
      select.appendChild(opt);
    });
  } catch (err) {
    status.textContent = "Could not load data. Check your connection.";
  }
}

document.getElementById('nameSelect').addEventListener('change', (e) => {
  const idx = e.target.value;
  const card = document.getElementById('card');
  if (idx === "") {
    card.style.display = 'none';
    return;
  }
  const person = people[idx];
  currentHours = Number(person.hours) || 0;
  currentRow = person.row;
  document.getElementById('hoursDisplay').textContent = currentHours;
  document.getElementById('status').textContent = '';
  card.style.display = 'block';
});

function changeHours(delta) {
  currentHours = Math.max(0, currentHours + delta);
  document.getElementById('hoursDisplay').textContent = currentHours;
}

async function saveHours() {
  const btn = document.getElementById('saveBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.textContent = "Saving...";
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ row: currentRow, hours: currentHours })
    });
    status.textContent = "Saved!";
  } catch (err) {
    status.textContent = "Error saving. Try again.";
  }
  btn.disabled = false;
  setTimeout(() => { status.textContent = ''; }, 2000);
}

loadData();
</script>
</body>
</html>
